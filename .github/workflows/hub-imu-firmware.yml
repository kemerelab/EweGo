name: hub-imu-firmware

# Builds the hub_imu USB IMU module firmware (STM32F042, Hardware/hub_imu/firmware/).
# Separate from the image pipeline: runs only when the firmware changes, in
# about a minute, and attaches hub_imu.bin to the run. A tag of the form
# hubimu-v* publishes a release with the binary.
#
# Flash through the hub with the module in DFU mode (hold BOOT0 high while
# plugging in, or 'dfu' on the console once this firmware is running):
#   dfu-util -a 0 -s 0x08000000:leave -D hub_imu.bin

on:
  push:
    branches: [main, phase-a-image]
    paths: ['Hardware/hub_imu/firmware/**', '.github/workflows/hub-imu-firmware.yml']
    tags: ['hubimu-v*']
  pull_request:
    paths: ['Hardware/hub_imu/firmware/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # ubuntu-latest became 26.04 (2026-11), where qemu-user-static is not installable
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # git describe for the version string
      - name: Install ARM toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi dfu-util
      - name: Fetch pinned dependencies (TinyUSB, CMSIS)
        run: bash Hardware/hub_imu/firmware/fetch-deps.sh
      - name: Build
        run: make -C Hardware/hub_imu/firmware
      - name: Flash and RAM usage
        run: |
          cd Hardware/hub_imu/firmware
          arm-none-eabi-size -A build/hub_imu.elf | awk '/^\.(isr_vector|text|ARM.exidx|data|bss|noinit)/ {print}'
          FLASH=$(arm-none-eabi-size -B build/hub_imu.elf | awk 'NR==2 {print $1+$2}')
          RAM=$(arm-none-eabi-size -B build/hub_imu.elf | awk 'NR==2 {print $2+$3}')
          echo "flash used: $FLASH / 32768 bytes; RAM (data+bss): $RAM / 6144 bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$FLASH" -le 32768 ] && [ "$RAM" -le 5632 ]   # leave 512 B of RAM for the stack
      - name: DFU suffix
        # hub_imu.dfu = the same binary with a DFU trailer naming the STM32
        # bootloader (0483:df11), so dfu-util checks the target and stops
        # warning. hub_imu.bin stays for tools that want a raw image.
        run: |
          cd Hardware/hub_imu/firmware/build
          cp hub_imu.bin hub_imu.dfu
          dfu-suffix -v 0483 -p df11 -d 0000 -a hub_imu.dfu
          dfu-suffix -c hub_imu.dfu
      - uses: actions/upload-artifact@v6
        with:
          name: hub_imu-firmware
          path: |
            Hardware/hub_imu/firmware/build/hub_imu.bin
            Hardware/hub_imu/firmware/build/hub_imu.dfu
            Hardware/hub_imu/firmware/build/hub_imu.elf
            Hardware/hub_imu/firmware/build/hub_imu.map
          retention-days: 14
      - name: Release
        if: startsWith(github.ref, 'refs/tags/hubimu-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          cp Hardware/hub_imu/firmware/build/hub_imu.bin "hub_imu-$TAG.bin"
          cp Hardware/hub_imu/firmware/build/hub_imu.dfu "hub_imu-$TAG.dfu"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "hub_imu firmware $TAG" --generate-notes
          gh release upload "$TAG" --clobber "hub_imu-$TAG.bin" "hub_imu-$TAG.dfu"
