# ============================================================================
# EweGo Time Synchronization
# ============================================================================
# Source ranking (best first):
#   1. Local GPS PPS (/dev/pps0)    — ~100 ns, only when GPS locked
#   2. Mesh peers (10.42.0.0/24)   — ~1-5 ms over bat0
#   3. Internet NTP                 — fallback, not expected in field
#   4. Local stratum 10             — last resort, no external sync

# --- Tier 1: Local GPS PPS ---
# Installed to /etc/chrony/sources.d/gps.conf by pi_setup.sh only when /dev/pps0
# exists (i.e. after first reboot with pps-gpio overlay active). Including
# the PPS refclock here would cause chronyd to fatal-error on boot if the
# device is absent. See Firmware/setup/chrony-gps.conf for the refclock lines.

# --- Tier 2: Mesh peers (bat0, 10.42.0.0/24) ---
# All 16 slots listed — unreachable IPs are silently skipped after iburst probe.
# GPS-equipped peers appear at stratum 1 and win selection automatically.
#
# Per-line options:
#   minpoll 0 maxpoll 2  — 1-4s polling. Time sync is the primary purpose of
#                          this mesh, so we pay ~4% radio duty for it. chrony
#                          adapts the interval within this range based on
#                          stability; `polltarget 30` (below) keeps it fast.
#   xleave               — interleaved NTP. Server includes its previous TX
#                          timestamp (taken just before the wire), which beats
#                          software RX timestamping by ~100µs. Biggest single
#                          win on WiFi without hardware timestamping.
#   maxdelay 0.1         — drop samples with >100ms RTT (batman-adv route flaps
#                          and IBSS contention spikes leak into offset estimate
#                          otherwise; typical root delay here is 5-7ms).
#   polltarget 30        — keep 30 samples in the loop-filter window before
#                          considering extending the poll interval (default 8).
#                          Pairs with minpoll 0 to actually stay fast.
server 10.42.0.1  iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.2  iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.3  iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.4  iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.5  iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.6  iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.7  iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.8  iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.9  iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.10 iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.11 iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.12 iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.13 iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.14 iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.15 iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30
server 10.42.0.16 iburst minpoll 0 maxpoll 2 maxdelay 0.1 xleave polltarget 30

# --- Tier 2.5: Field laptop (10.42.0.100 on the mesh) ---
# The laptop serves internet-NTP time (stratum ~3) whenever it joins the mesh
# (see mesh_join.sh / laptop chrony setup). Stratum 3 < orphan stratum 10, so
# every node — including the ewe1 anchor — snaps to true time, and any
# time-island split (e.g. anchor rebooted with a stale clock restore,
# 2026-07-08 hotel incident) heals within seconds of the laptop appearing.
# Silently skipped when the laptop is absent. maxdelay is looser than the
# peer lines: the laptop is one IBSS hop away but often busier.
# trust: exempt the laptop from falseticker voting. Without it, a flock
# that drifted together (self-consistent but wrong) outvotes the single
# correct source 7-to-1 and marks it ^x — seen 2026-07-09 when the flock
# sat 618 s slow and rejected the freshly internet-synced laptop. The
# laptop only serves NTP while synced to a real source, so trusting it
# cannot inject an unsynced clock.
server 10.42.0.100 iburst minpoll 2 maxpoll 4 maxdelay 0.3 xleave polltarget 30 trust

# --- Tier 3: Internet NTP (fallback, not expected in field) ---
# Slower polling (minpoll 6 = 64s) keeps internet sources lower priority than mesh.
pool pool.ntp.org iburst minpoll 6 maxpoll 10

# --- Serve time to mesh peers ---
allow 10.42.0.0/24

# --- Last resort: uniform orphan election ---
# The `local` directive is NOT in this base file. pi_setup.sh installs the
# SAME line on every node into /etc/chrony/conf.d/local-fallback.conf:
#
#   local stratum 10 orphan
#
# chrony's orphan mode elects the active anchor among reachable nodes by
# lowest reference ID (= lowest mesh IP); everyone else follows at stratum
# 11. Any subset of devices stays mutually synced (only ewe4/5/6 deployed →
# ewe4 anchors), with no designated-anchor devices.
#
# Every node also gets a chrony.service drop-in (pi_setup.sh §7.6) that
# one-shot steps to flock consensus at boot BEFORE chronyd starts — without
# it, a node rebooting with a stale clock self-anchors and can never rejoin
# (orphan mode ignores sources at stratum >= its own): that's the 2026-07-08
# time-island incident.
#
# History: an earlier all-orphan design was reverted after a Pi with wedged
# IBSS unicast (brcmfmac bug: unicast dead, OGM broadcasts flowing) promoted
# itself and sat stranded. Interim tiered anchors (ewe1/2 only) traded that
# for a worse failure — subsets without ewe1/2 had no time sync at all, and
# a stale-rebooted anchor split the flock. Uniform orphan + boot pre-sync +
# unlimited makestep covers both: a wedged node still strands itself while
# wedged (nothing can fix a node that hears no one), but demotes and re-steps
# the moment the wedge clears.
confdir /etc/chrony/conf.d

# --- Standard settings ---
driftfile /var/lib/chrony/drift
makestep 1.0 -1
# Reject frequency adjustments based on noisy samples (>100 PPM apparent skew).
# Stops mesh jitter from convincing chrony the local oscillator changed rate.
maxupdateskew 100.0
rtcsync
logdir /var/log/chrony
log tracking measurements statistics
leapsectz right/UTC
