# ewego-audio: stereo microphone recorder (arecord, via ewego-audio-record).
# DEVICE is normally empty: the voicehat card is found by name in
# /proc/asound/cards and used as plughw:CARD=<id>,DEV=0 (ALSA "default" is
# not guaranteed to be it). To pin a device: DEVICE=plughw:CARD=sndrpigooglevoi,DEV=0
# (`arecord -l` lists them; `ewego-audio-record --print-device` shows the choice).
OUT_DIR=/opt/ewego/recordings/audio
DEVICE=
