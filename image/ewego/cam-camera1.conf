# ewego-cam@camera1: which USB camera to record and how.
# DEVICE: auto:N/M = the Nth of the M cameras found, ordered by USB hub port
#         (camera1 = lowest port, so it works on any hub and whatever order
#         the kernel enumerates them in); or port:<hub port> to pin a camera
#         to a physical port (hub_cam: 1.1 and 1.3); or /dev/videoN.
#         ewego-cam --list shows both forms.
DEVICE=auto:1/2
SIZE=1920x1080
FPS=30
OUT_DIR=/opt/ewego/recordings/camera1
EXTRA_ARGS=--stats 5 --live /run/ewego
