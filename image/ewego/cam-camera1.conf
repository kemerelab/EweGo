# ewego-cam@camera1: which USB camera to record and how.
# DEVICE: /dev/videoN, a /dev/v4l/by-path link, or port:<USB hub port>
#         (stable across reboots). List ports with: ewego-cam --list
# port:1.3 / port:1.4 are the camera ports on the current hub (hub_cam will
# move them to port:1.1 / port:1.3). Check with: ewego-cam --list
DEVICE=port:1.3
SIZE=1920x1080
FPS=30
OUT_DIR=/opt/ewego/recordings/camera1
EXTRA_ARGS=--stats 5
