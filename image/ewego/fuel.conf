# ewego-fuel: MAX17048 battery gauge CSV (same columns as sensor_test.py wrote).
OUT_DIR=/opt/ewego/recordings/fuel
INTERVAL=2
# Low-battery shutdown: when the charge is below SHUTDOWN_SOC (percent) AND
# the cell voltage below SHUTDOWN_VOLTAGE (volts) for SHUTDOWN_SAMPLES
# consecutive readings (30 x INTERVAL 2 s = 1 minute), the logger notes it in
# events.log next to fuel_gauge.csv and in the journal, then runs
# `systemctl poweroff`, which stops the recorders cleanly before the battery
# dies mid-write. SHUTDOWN=0 only logs it (bench, USB-powered, no battery).
SHUTDOWN=1
SHUTDOWN_SOC=8
SHUTDOWN_VOLTAGE=3.5
SHUTDOWN_SAMPLES=30
