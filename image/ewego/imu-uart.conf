# ewego-imu-uart: the wearable's own BNO055 on the CM4's UART5.
PORT=/dev/ttyAMA5
BAUD=115200
# samples per second; 100 is the BNO055 fusion output rate
RATE=100
OUT_DIR=/opt/ewego/recordings/imu-uart
NAME=imu-uart
# --rt: reader thread on SCHED_FIFO so the UART timing does not suffer when
#       the SD card is busy; --live /run/ewego: live view for the console
EXTRA_ARGS=--stats 30 --rt --live /run/ewego
