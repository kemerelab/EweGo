# ewego-imu-usb: the hub_imu USB IMU on the camera hub.
# DEVICE_ARG is normally empty (auto-detect by VID:PID 1209:0001). To pin a
# node: DEVICE_ARG=--device /dev/hidraw0
OUT_DIR=/opt/ewego/recordings/imu
NAME=imu
DEVICE_ARG=
# --rt: the reader thread runs SCHED_FIFO so a busy SD card never delays the
#       HID polling (the kernel buffers only 0.6 s of reports per reader)
# --live /run/ewego: counters + recent samples for the console's live view
EXTRA_ARGS=--stats 5 --rt --live /run/ewego
