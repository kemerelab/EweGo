# Installed by image/inject-ewego.sh as
# /etc/systemd/journald.conf.d/ewego.conf.
#
# The journal lives on the same SD card as the recordings. Keep it
# persistent (post-mortems after a field reboot or a low-battery poweroff
# need the previous boot's log) but bounded, and rate-limit a unit that
# starts printing in a loop so it cannot write the card continuously.
[Journal]
Storage=persistent
SystemMaxUse=100M
RuntimeMaxUse=50M
RateLimitIntervalSec=30s
RateLimitBurst=1000
