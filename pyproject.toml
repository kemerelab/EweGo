[project]
name = "ewego"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyserial>=3.5",
    "pyubx2>=1.2.59",
]
# picamera2 is installed system-wide via apt (depends on libcamera)

[project.optional-dependencies]
# Dev-side tools only (player script) — not needed on Pi
dev = [
    "opencv-python>=4.13.0.92",
    "numpy",
]

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git,.gitignore,.gitattributes,*.pdf'
check-hidden = true
# ignore-regex = ''
# ignore-words-list = ''
